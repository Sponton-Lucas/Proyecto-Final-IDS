<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block tittle %}Admin - Pasillo Colón{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin/admin_sidebar.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
  {% block estilos %}{% endblock %}
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <nav class="col-md-3 col-lg-2 d-md-block sidebar">
        <div class="sidebar-header">
          <h5 class="text-white fw-bold mb-0">Panel admin</h5>
        </div>
        <div class="nav flex-column nav-pills">
          <a href="{{ url_for('admin_index.dashboard') }}"    class="nav-link text-start {% if request.endpoint == 'admin_index' %}active{% endif %}"><i class="bi bi-bar-chart-line me-2"></i> Dashboard</a>
          <a href="{{ url_for('admin_menu_bp.admin_menu') }}"     class="nav-link text-start {% if request.endpoint == 'admin_menu' %}active{% endif %}"><i class="bi bi-list-ul me-2"></i> Gestión de Menú</a>
          <a href="{{ url_for('admin_reservas_bp.admin_reservas') }}"  class="nav-link text-start {% if request.endpoint == 'admin_reservas' %}active{% endif %}"><i class="bi bi-calendar-check me-2"></i> Control de Reservas</a>
          <a href="{{ url_for('admin_usuarios_bp.admin_usuarios') }}"  class="nav-link text-start {% if request.endpoint == 'admin_usuarios' %}active{% endif %}"><i class="bi bi-people me-2"></i> Padrón de Usuarios</a>
          <a href="{{ url_for('admin_resenas_bp.admin_resenas') }}"   class="nav-link text-start {% if request.endpoint == 'admin_resenas' %}active{% endif %}"><i class="bi bi-star-half me-2"></i> Auditoría de Reseñas</a>
          <div class="mt-4 px-3">
            <a href="/" class="btn btn-outline-secondary btn-sm mb-2">
              <i class="bi bi-house me-2"></i>Volver al sitio
            </a>
            <form action="/logout" method="post">
              <button type="submit" class="btn btn-outline-danger btn-sm">
                <i class="bi bi-box-arrow-left me-2"></i>Cerrar Sesión
              </button>
            </form>
          </div>
        </div>
      </nav>

      <main class="col-md-9 ms-sm-auto col-lg-10 main-content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  {% block scripts %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
