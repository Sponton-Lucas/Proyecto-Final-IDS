<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block tittle %}Nombre restaurante{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
    {% block estilos %}{% endblock %} 
</head>
<body class="body">
    <header>
        <nav class="navbar navbar-expand-lg navbar-border">
            <div class="container-fluid">
                <div class="collapse navbar-collapse menu-hamburguesa" id="navbarNavDropdown">
                    <ul class="navbar-nav">
                        <li class="nav-item dropdown">
                            <a class="nav-link" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-list" viewBox="0 0 16 16">
                                    <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
                                </svg>       
                            </a>
                            <ul class="dropdown-menu dropdown-menu-fondo">
                                <li><a class="dropdown-item" href="{{ url_for('index') }}">Inicio</a></li>
                                <li><a class="dropdown-item" href="{{ url_for('menu.menu') }}">Menu</a></li>
                                <li><a class="dropdown-item" href="{{ url_for('conocenos') }}">Conocenos</a></li>
                                <li><a class="dropdown-item" href="{{ url_for('resenas.resenas') }}">Reseñas</a></li>
                                <li><a class="dropdown-item" href="{{ url_for('reservas.reservas') }}">Reservas</a></li>
                                <li><a class="dropdown-item" href="{{ url_for('login.login') }}">Login</a></li>
                                <li><a class="dropdown-item" href="{{ url_for('registro.registro') }}">Registro</a></li>
                                <li><a class="dropdown-item" href="{{ url_for('usuario.user') }}">Usuario</a></li>
                                {% if session.get('es_admin') %}
                                <li><a class="dropdown-item" href="{{ url_for('admin_index.dashboard') }}">Panel Admin</a></li>
                                {% endif %}
                            </ul>
                        </li>
                    </ul>
                </div>
                <div class="ms-5">
                    <a class="btn" href="{{ url_for('index') }}" role="button">
                        <h1 class="navbar-title"><b>PASILLO COLÓN</b></h1>
                    </a>
                </div>
                <div>
                    <a class="boton" href="{{ url_for('reservas.reservas') }}" role="button">
                        <span class="boton-texto">Reservar ahora</span>
                        <span class="boton-icono">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-right" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8"/>
                            </svg>
                        </span>
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>

    </footer>
    <script src="../static/js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
