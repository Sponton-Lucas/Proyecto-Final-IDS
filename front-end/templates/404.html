<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>404 - Página no encontrada</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/boton.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/error.css') }}">
</head>
<body>
<div class="error-container">
    <div class="spinner-border spinner-estilos" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <h1>404</h1>
    <p>Ups... la ruta que buscás no existe.</p>
    <div>
        <a class="boton" href="{{ url_for('index') }}" role="button">
            <span class="boton-texto">Volver al inicio</span>
            <span class="boton-icono">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-right" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8"/>
                </svg>
            </span>
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
