{% extends "base.html" %}

{% block title %} Admin - Modificar Artículo {% endblock %}

{% block content %}
<div class="container mt-4">
  <h2>Modificar Artículo</h2>
  <form method="POST" action="/admin/modificar-articulo/{{ articulo.id }}" enctype="multipart/form-data">
    
    <div class="mb-3">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" class="form-control" value="{{ articulo.nombre }}" required>
    </div>
    
    <div class="mb-3">
      <label for="descripcion">Descripción</label>
      <textarea id="descripcion" name="descripcion" class="form-control" rows="3">{{ articulo.descripcion }}</textarea>
    </div>
    
    <div class="mb-3">
      <label for="precio">Precio</label>
      <input type="number" id="precio" name="precio" class="form-control" step="0.01" value="{{ articulo.precio }}" required>
    </div>
    
    <div class="mb-3">
      <label for="categoria">Categoría</label>
      <select id="categoria" name="categoria" class="form-select">
        <option value="entrada" {% if articulo.categoria == 'entrada' %}selected{% endif %}>Entrada</option>
        <option value="principal" {% if articulo.categoria == 'principal' %}selected{% endif %}>Plato Principal</option>
        <option value="postre" {% if articulo.categoria == 'postre' %}selected{% endif %}>Postre</option>
      </select>
    </div>
    
    <div class="mb-3">
      <label for="imagen">Nueva imagen</label>
      <input type="file" id="imagen" name="imagen" class="form-control">
    </div>
    
    <button type="submit" class="btn btn-success">Guardar cambios</button>
  </form>
</div>
{% endblock %}
